<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>席替えドラフト 管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="offline" class="offline" hidden></div>
  <main>
    <section id="loadingScreen" class="center"><p class="muted">読み込み中…</p></section>

    <section id="loginScreen" class="center panel" hidden>
      <h1>管理者ログイン</h1>
      <p class="muted">登録済みの教員アカウントでログインしてください</p>
      <button id="googleLogin" class="btn btn-primary btn-lg">Google でログイン</button>
      <p><button id="emulatorLogin" class="btn btn-sm" hidden>テスト用ログイン（ローカル実行時のみ）</button></p>
    </section>

    <section id="notAdminScreen" class="center panel" hidden>
      <h1>管理者として登録されていません</h1>
      <p><span id="myEmail"></span> でログインしています。</p>
      <p class="muted">Firebase コンソールの Firestore で、<b>admins</b> コレクションに次の ID のドキュメントを作成すると管理者になれます。</p>
      <code class="uid" id="myUid"></code>
      <p><button class="btn logout">ログアウト</button></p>
    </section>

    <section id="roomsScreen" class="center panel" hidden>
      <h1>部屋一覧</h1>
      <ul id="roomList" class="room-list"></ul>
      <form id="createRoom" class="row">
        <input id="newClassName" type="text" placeholder="クラス名（例：2年3組）" maxlength="30" required style="flex:1">
        <button class="btn btn-primary">新しい部屋を作る</button>
      </form>
      <p><button class="btn btn-ghost logout">ログアウト</button></p>
    </section>

    <section id="roomScreen" hidden>
      <div class="header no-print">
        <div>
          <h1 id="roomTitle"></h1>
          <span class="muted">参加コード <span class="code" id="roomCodeLabel"></span>・<a id="roomUrl" target="_blank" rel="noopener"></a></span>
        </div>
        <div class="row">
          <button id="showQr" class="btn">参加用 QR を表示</button>
          <button id="backToRooms" class="btn btn-ghost">部屋一覧</button>
        </div>
      </div>
      <div id="banner" class="banner"></div>
      <div class="admin-layout">
        <div>
          <div id="controls" class="panel no-print"></div>
          <div class="panel seat-area">
            <h2 class="print-title" id="printTitle">座席表</h2>
            <label class="muted no-print"><input type="checkbox" id="flip"> 教卓側から見た向きで表示</label>
            <div id="seatGrid"></div>
            <p class="muted no-print">赤字＝このラウンドの投票先（生徒には結果発表まで見えません）</p>
          </div>
        </div>
        <aside class="panel no-print">
          <h2>参加者 <span class="muted" id="playerCount"></span></h2>
          <ul id="playerList" class="players"></ul>
        </aside>
      </div>
    </section>
  </main>

  <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalButtons" class="modal-buttons"></div>
    </div>
  </div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
