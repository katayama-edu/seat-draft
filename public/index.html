<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>席替えドラフト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="offline" class="offline" hidden></div>
  <main>
    <section id="loadingScreen" class="center"><p class="muted">読み込み中…</p></section>

    <section id="roomScreen" class="center panel" hidden>
      <h1>席替えドラフト</h1>
      <p class="muted">先生から伝えられた参加コードを入力してください</p>
      <form id="roomForm" class="stack">
        <input id="roomCode" type="text" class="code" maxlength="6" autocomplete="off" placeholder="例：K7QX2M" required>
        <button class="btn btn-primary btn-lg">次へ</button>
      </form>
    </section>

    <section id="joinScreen" class="center panel" hidden>
      <h1>参加登録</h1>
      <p class="muted" id="joinClass"></p>
      <form id="joinForm" class="stack">
        <label>名前（フルネーム）
          <input id="joinName" type="text" maxlength="20" autocomplete="off" required>
        </label>
        <div class="radio-row">
          <label><input type="radio" name="gender" value="M" required>男子</label>
          <label><input type="radio" name="gender" value="F">女子</label>
        </div>
        <button class="btn btn-primary btn-lg">参加する</button>
      </form>
    </section>

    <section id="gameScreen" hidden>
      <div class="header">
        <div><h1 id="className"></h1><span class="muted" id="meLabel"></span></div>
      </div>
      <div id="banner" class="banner"></div>
      <div class="panel seat-area">
        <div id="seatGrid"></div>
        <div class="legend">
          <span><i style="background:var(--seat-m)"></i>男子席</span>
          <span><i style="background:var(--seat-f)"></i>女子席</span>
          <span><i style="background:var(--seat-any)"></i>誰でも</span>
          <span><i style="background:var(--taken)"></i>確定済み</span>
          <span><i style="background:var(--mine)"></i>あなたの席</span>
          <span><i style="background:var(--reserved)"></i>競合中（当事者のみ投票可）</span>
        </div>
      </div>
      <div id="voteBar" class="vote-bar" hidden>
        <span>選択中：<b id="selectedLabel"></b></span>
        <button id="submitVote" class="btn btn-primary btn-lg" disabled>この席で送信</button>
      </div>
    </section>
  </main>

  <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalButtons" class="modal-buttons"></div>
    </div>
  </div>
  <script type="module" src="js/student.js"></script>
</body>
</html>
