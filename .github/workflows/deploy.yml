name: Deploy

# master に push されたら、テストしてから Firebase にデプロイする
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npm test

      # デプロイ先（.firebaserc の prod）と鍵（Secrets）がそろっているときだけデプロイする
      - name: Check deploy settings
        id: check
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::Secrets に FIREBASE_SERVICE_ACCOUNT が未登録のため、デプロイをスキップしました"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif ! node -e 'process.exit(require("./.firebaserc").projects.prod ? 0 : 1)'; then
            echo "::notice::.firebaserc に prod（本番のプロジェクト ID）が未設定のため、デプロイをスキップしました"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        if: steps.check.outputs.ok == 'true'
        run: npx firebase deploy --only hosting,firestore --project prod --non-interactive
